spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
  sql:
    init:
      mode: never
  main:
    lazy-initialization: true
  application:
    name: cat_photo_s3
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}
  datasource:
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 900000
      keepalive-time: 90000
      validation-timeout: 5000
      connection-timeout: 30000
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:/app/data/catdata.db

server:
  tomcat:
    connection-timeout: 120s
    threads:
      max: 8
      min-spare: 1

minio:
  photosBucket: photo
  thumbsBucket: thumbs
  thumbsPrefix: ""
  coordinationBucket: coordination
  storage:
    endpoint: http://localhost:9000
    login: minioadmin
    password: minioadmin

app:
  photos